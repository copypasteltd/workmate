<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>CopyPaste · Local browser</title><link rel="stylesheet" href="browser-shell.css"></head>
<body><header class="titlebar"><div class="brand">copypaste<span>.</span></div><div class="ownership"><i></i><span id="owner-label">Local browser</span></div><div class="window-buttons"><button id="minimize" aria-label="Minimize">−</button><button id="maximize" aria-label="Maximize">□</button><button id="close" class="close" aria-label="Close">×</button></div></header>
<nav aria-label="Browser navigation"><button id="back" aria-label="Back" title="Back">←</button><button id="forward" aria-label="Forward" title="Forward">→</button><button id="reload" aria-label="Reload" title="Reload">↻</button><form id="address-form"><label class="sr-only" for="address">Website address</label><span class="web-mark" aria-hidden="true">◎</span><input id="address" type="url" autocomplete="off" spellcheck="false" placeholder="https://" required><button type="submit" aria-label="Go">↗</button></form><div class="session-note" id="session-note">Task pages close when the agent stops</div></nav>
<div id="status" role="status" aria-live="polite"></div><aside id="dialog" hidden><span id="dialog-message"></span><button id="dismiss">Dismiss</button><button id="accept">Accept</button></aside><script src="browser-shell.js"></script></body></html>
